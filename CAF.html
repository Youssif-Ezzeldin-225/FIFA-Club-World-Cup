<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAF Qualifiers</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="x-image" href="images/FIFA Club World Cup.svg">
    <style>
        .topic{
            background-color: #597928;
        }
        .topic1{
            color: #FCECD8;
        }
        .cards{
            background-color: #91AC67;
        }
        .topic2{
            background-color: #C4F7CA;
        }
        .card{
            background-color: #597928;
            color: black;
        }
        .card:hover{
            background-color: #6E3511;
            color: #FCECD8;
        }
        .sec-cards button{
            background-color: rgb(148, 0, 0);
            font-size: 30px;
            color: #FCECD8;
            border: none;
            font-family: 'dubai';
        }
        .sec-cards button:hover{
            background-color: #ff1e00;
        }
    </style>
</head>
<body style="background-color: #6E3511;">
    <div class="topic"><span style="font-size: 50px; font-family: fantasy;"><span class="topic1">AFC Qualifiers </span></span></div>
    <section class="sec-cards">
        <div class="topic2">There are only 4 qualifiers</div>
        <div class="cards">
            <table><tr>
            <td><a href="#"><div class="card">
                <div class="img-card"><img src="images/pyramids.png" alt="Pyramids FC"></div>
                Pyramids FC<br>Already Qualified
            </div></a></td>
            <td><a href="#"><div class="card">
                <div class="img-card"><img src="images/alahly.png" alt="Al Ahly"></div>

            </div></a></td>
            <td><a href="#"><div class="card">
                <div class="img-card"><img src="images/Mamelodi Sundowns.jpg" alt="Mamelodi Sundowns"></div>

            </div></a></td>
            <td><a href="#"><div class="card">
                <div class="img-card"><img src="images/Espérance de Tunis.jpg" alt="Espérance de Tunis"></div>

            </div></a></td></tr>
            <tr><td><a href="#"><div class="card">
                <div class="img-card"><img src="images/Wydad Casablanca.jpg" alt="Wydad Casablanca"></div>

            </div></a></td>
            <td><a href="#"><div class="card">
                <div class="img-card"><img src="images/Raja Casablanca.png" alt="Raja Casablanca "></div>
                Raja Casablanca 
            </div></a></td>
            <td><a href="#"><div class="card">
                <div class="img-card"><img src="images/zamalek.jpg" alt="Zamalek"></div>
                Zamalek <br>
            </div></a></td></tr>
            
        </table>
    </div>
    <button>الأهلى فوق الجميع</button>
